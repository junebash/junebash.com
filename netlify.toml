[build]
publish = "public"
command = "zola build"

[build.environment]
ZOLA_VERSION = "0.20.0"

[context.production]
command = "zola build"

[context.deploy-preview]
command = "zola build --base-url $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "zola build --base-url $DEPLOY_PRIME_URL"

# Redirect rules

# Fancy mode: every path on fancy.junebash.com is the terminal shell page,
# except the files the terminal itself loads. First match wins, so these come first.
[[redirects]]
from = "https://fancy.junebash.com/fancy/build/*"
to = "/fancy/build/:splat"
status = 200
force = true

[[redirects]]
from = "https://fancy.junebash.com/images/*"
to = "/images/:splat"
status = 200
force = true

[[redirects]]
from = "https://fancy.junebash.com/*"
to = "/fancy/index.html"
status = 200
force = true

# Fancy mode on the main domain and deploy previews lives under /fancy/.
[[redirects]]
from = "/fancy/*"
to = "/fancy/index.html"
status = 200

[[redirects]]
from = "/blog/*"
to = "/posts/:splat"
status = 301

[[redirects]]
from = "/projects/*"
to = "/code/:splat"
status = 301

# Headers for better performance
[[headers]]
for = "/fancy/build/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.woff2"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"